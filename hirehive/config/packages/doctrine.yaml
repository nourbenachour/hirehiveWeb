doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        # MySQL piweb3a : serverVersion peut aussi être dans DATABASE_URL (?serverVersion=8.0)
        server_version: '8.0'
        charset: utf8mb4
        # Map MySQL ENUM to string so schema update/migrations work without a custom type
        mapping_types:
            enum: string
        default_table_options:
            charset: utf8mb4
            collate: utf8mb4_unicode_ci
        use_savepoints: true
        # Limite les tables gérées aux tables de Nour uniquement
        schema_filter: '~^(users|userrs|recruiter|condidat|face_enrollments|direct_message|conversation_direct|experience|profile_views|password_reset_tokens|doctrine_migration_versions2?)$~'
    orm:
        auto_generate_proxy_classes: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
